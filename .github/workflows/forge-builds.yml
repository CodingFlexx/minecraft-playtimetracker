name: Forge GUI and No GUI builds

on:
  push:
    branches: [main]
    paths: ['forge-1.18.2/**', 'src/**', '.github/workflows/forge-builds.yml']
  pull_request:
    paths: ['forge-1.18.2/**', 'src/**', '.github/workflows/forge-builds.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [gui, nogui]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Build, test and verify variant
        working-directory: forge-1.18.2
        run: ./gradlew --no-daemon -Pvariant=${{ matrix.variant }} build
      - name: Live statistics regression tests in Forge
        if: matrix.variant == 'gui'
        working-directory: forge-1.18.2
        run: ./gradlew --no-daemon -Pvariant=gui runGameTestServer
      - name: Downloadable JARs and checksums
        uses: actions/upload-artifact@v7
        with:
          name: playtimetracker-1.18.2-forge-${{ matrix.variant }}
          path: forge-1.18.2/build/${{ matrix.variant }}/libs/*
          if-no-files-found: error
          retention-days: 30
